name: Publish reader
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assemble verified public PDF
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          parts = Path("pdf-parts")
          target = Path("downloads/orukan-v8.pdf")
          target.parent.mkdir(exist_ok=True)
          with target.open("wb") as output:
              for index in range(58):
                  output.write((parts / f"part-{index:03}.bin").read_bytes())
          assert target.stat().st_size == 90478119
          assert hashlib.sha256(target.read_bytes()).hexdigest() == "b1a9bc0baa9421c73d88926ec1b595fb3e76f5c39f76366757144a96f1c7c0ec"
      - name: Fetch verified corrected public PDF
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import urllib.request
          target = Path("downloads/orukan-v9.pdf")
          with urllib.request.urlopen("https://github.com/kawauso9991/orukan-manga/releases/download/v9/orukan-v9.pdf", timeout=120) as source, target.open("wb") as output:
              while chunk := source.read(1024 * 1024):
                  output.write(chunk)
          assert target.stat().st_size == 85608794
          assert hashlib.sha256(target.read_bytes()).hexdigest() == "216415257816368dbb39f6062b9f717a4aeec2bdf32fc29276886afeef8b7206"
      - name: Fetch verified v10 public PDF
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import urllib.request
          target = Path("downloads/orukan-v10.pdf")
          with urllib.request.urlopen("https://github.com/kawauso9991/orukan-manga/releases/download/v10/orukan-v10.pdf", timeout=120) as source, target.open("wb") as output:
              while chunk := source.read(1024 * 1024):
                  output.write(chunk)
          assert target.stat().st_size == 111751633
          assert hashlib.sha256(target.read_bytes()).hexdigest() == "898721b8b81b1e647232334ce6fdb37b3e2d798a23db8b1833bf9cab368aeb2a"
      - name: Fetch verified v11.1 public PDF
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import urllib.request
          target = Path("downloads/orukan-v11.1.pdf")
          with urllib.request.urlopen("https://github.com/kawauso9991/orukan-manga/releases/download/v11.1/orukan-v11.1.pdf", timeout=120) as source, target.open("wb") as output:
              while chunk := source.read(1024 * 1024):
                  output.write(chunk)
          assert target.stat().st_size == 111991201
          assert hashlib.sha256(target.read_bytes()).hexdigest() == "d95e7da2aa35798f0a93a28dd66bddf162ef68d18332a67264d54c437c900f2d"
      - name: Stage reader files
        run: |
          mkdir -p _site
          cp -r -- index.html read.html assets data pages downloads README.md SHA256SUMS _site/
          cd _site
          sha256sum --check SHA256SUMS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
